<section class="filters">
  <h2 class="filters__title">Filtros Rápidos</h2>
  <div class="filters__row">
    @for (_v of [filtrosVersion()]; track _v) {
      @for (opt of options; track opt.key + filtrosVersion()) {
        <po-checkbox
          [p-label]="opt.label"
          [ngModel]="filtros()[opt.key]"
          [ngModelOptions]="{ standalone: true }"
          (p-change)="onToggle(opt.key)"
        />
      }
    }
  </div>
</section>
